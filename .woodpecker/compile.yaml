when:
  - event: push
    branch: [main, develop]

steps:
  - name: Build
    image: mcr.microsoft.com/dotnet/sdk:8.0
    commands:
      - dotnet --version
      - dotnet restore
      - dotnet build --configuration Release
      - cd SourceProcessorApp
      - dotnet publish --configuration Release --output ./publish
